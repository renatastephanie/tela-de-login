<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="styles/media-query.css">
</head>

<body>
    <main>
        <section id="login">
            <div id="imagem">

            </div>

            <div id="formulario">
                <h1>Login</h1>
                <p>
                    Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder configurar no seu ambiente!
                </p>

                <form action="login.php" method="post" autocomplete="on">
                    <div class="campo">
                        <span class="material-symbols-outlined">
                            <img src="/img/person.png" class="icone">
                        </span>
                        <input type="email" name="login" id="ilogin" placeholder="Digite seu e-mail"
                            autocomplete="email" required maxlength="30">
                        <label for="ilogin">Login</label>
                    </div>

                    <div class="campo">
                        <span class="material-symbols-outlined">
                            <img src="/img/key.png" class="icone">
                        </span>
                        <input type="password" name="Senha" id="isenha" placeholder="Digite sua senha"
                            autocomplete="current-password" required minlength="8" maxlength="20">
                        <label for="isenha">Senha</label>
                    </div>
                    <input type="submit" value="Entrar">
                    <a href="esqueci.html" class="botao">
                        Esqueci a Senha <span class="material-symbols-outlined"><img src="/img/email.png" class="email"></span>
                    </a>
                </form>
            </div>
        </section>
    </main>
</body>

</html>
